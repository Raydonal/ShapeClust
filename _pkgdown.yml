url: https://raydonal.github.io/ShapeClust/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]

reference:
  - title: "Geometry"
    desc: "From landmark configurations to complex pre-shapes and shape-space distances."
    contents:
      - helmert_submatrix
      - landmarks_to_preshape
      - rho_matrix
      - dF_matrix

  - title: "Clustering algorithms"
    desc: "PAM and Ranked K-medoids adapted to Kendall's 2D shape space."
    contents:
      - shape_pam
      - shape_rankkmed

  - title: "Bagging ensemble"
    desc: "BagClust1 wrapper and label alignment."
    contents:
      - bagclust1
      - align_labels

  - title: "Validation"
    desc: "External validation indices and paired Wilcoxon tests."
    contents:
      - rand_index
      - fmi_index
      - relative_gain
      - riemannian_variances
      - wilcoxon_paired_gain

  - title: "Simulation"
    contents:
      - sim_complex_bingham
      - sim_landmark_gaussian

  - title: "Model selection"
    contents:
      - select_K

articles:
  - title: "Introduction"
    contents:
      - getting-started
